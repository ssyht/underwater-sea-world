<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Wreck</title>
<meta name="description" content="A procedural underwater world: kelp forest, reef, whale skeleton and a sunken ship, made entirely in code.">
<meta name="theme-color" content="#08263A">

<style>
:root{--glass:rgba(5,22,32,.52);--line:rgba(191,239,245,.16);--ink:#E6FAFF;--ink2:rgba(230,250,255,.7);--glow:#7FE3D6}
html,body{margin:0;height:100%;overflow:hidden;background:#08263A;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none}
::selection{background:rgba(127,227,214,.35)}
#debug{position:fixed;left:8px;top:8px;z-index:20;padding:6px 9px;border-radius:6px;background:rgba(2,12,18,.6);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;pointer-events:none;display:none}
#msg{position:fixed;inset:0;display:grid;place-items:center;z-index:30;padding:24px;text-align:center;color:var(--ink2);pointer-events:none;transition:opacity .8s}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid var(--line);background:rgba(5,22,32,.25);display:none;pointer-events:none;z-index:15}
#joy i{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(230,250,255,.28)}
[hidden]{display:none!important}
#ui{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:10;max-width:calc(100vw - 32px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
#ui.hide{opacity:0;transform:translateY(10px);pointer-events:none;transition-duration:.35s}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:16px;-webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);box-shadow:0 14px 40px rgba(0,8,14,.35)}
#card{padding:22px 22px 18px;width:min(380px,calc(100vw - 32px));box-sizing:border-box}
#card h1{margin:0 0 6px;font-size:clamp(30px,7vw,38px);line-height:1.05;font-weight:650;letter-spacing:-.025em}
#card p{margin:0 0 18px;color:var(--ink2);max-width:32ch}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:rgba(230,250,255,.07);color:var(--ink);cursor:pointer;transition:background .2s}
button:hover{background:rgba(230,250,255,.15)}
button.primary{background:var(--ink);color:var(--deep);border-color:transparent}
button.primary:hover{background:#fff}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
#card .hint{margin:14px 0 0;font-size:13px}
.hint{color:var(--ink2)}
#hud{display:flex;align-items:center;gap:10px;padding:7px 7px 7px 16px}
#hud b{font-weight:650;letter-spacing:-.01em;margin-right:4px}
#hud .hint{font-size:12.5px;margin-right:4px}
#hud button{min-height:40px;padding:0 14px;font-size:14px}
@media (max-width:640px){#hud .hint{display:none}}
@media (prefers-reduced-motion:reduce){#ui,#ui *{transition:none!important}}
</style>

    const a = R.a0 + R.halfA * (-0.82 + c * 0.33), cx = R.cx + Math.cos(a) * (R.r + (rnd() - 0.5) * 8), cz = R.cz + Math.sin(a) * (R.r + (rnd() - 0.5) * 8);
    const list = [];

      list.push([cx + Math.cos(b) * d, cz + Math.sin(b) * d, big, big * (0.6 + rnd() * 0.7), rnd() * TAU, 0.7 + rnd() * 0.5]);
    }

  }
  const wall = []; // a rocky outcrop on the kelp edge facing the clearing
  for (let i = 0; i < (HIGH ? 9 : 6); i++) { const t = i / 8; wall.push([-27 + t * 7 + rnd() * 2, -21 + t * 12 + rnd() * 2, 2 + rnd() * 2.2, 2.6 + rnd() * 2.8, rnd() * TAU, 0.8 + rnd() * 0.4]); }
  rockCluster(wall);
  const sc = scatter(HIGH ? 12 : 7, rnd, inDisc(rnd, 0, 5, 30), 5, (x, z) => Math.hypot(x, z - 5) > 19 && keepOff(x, z) && reefDist(x, z) > 1.1);
  rockCluster(sc.map((p) => [p[0], p[1], 0.6 + rnd() * 1.4, 0.5 + rnd() * 0.9, rnd() * TAU, 0.8 + rnd() * 0.4]));
  const far = scatter(HIGH ? 10 : 6, rnd, inDisc(rnd, 10, 0, 85), 9, (x, z) => Math.hypot(x, z) < 86 && Math.hypot(x, z) > 40 && keepOff(x, z) && reefDist(x, z) > 1.2 && Math.hypot(x - Z.kelp.x, z - Z.kelp.z) > 30);
  rockCluster(far.map((p) => [p[0], p[1], 1.5 + rnd() * 3, 1.2 + rnd() * 2.5, rnd() * TAU, 0.7 + rnd() * 0.6]));
}

// coral heads: brain domes and branching coral, instanced, coloured per instance
const CORALS = []; // [x, y, z, scale] — reef fish use these as homes
let CORAL_KIT, FAN_KIT; // shared with the wreck (Phase 3)
{
  const rnd = rng(202), cols = ['coralPink', 'coralOrange', 'coralPurple', 'coralYellow'].map(C);
  const brainG = new THREE.SphereGeometry(1, HIGH ? 16 : 10, HIGH ? 9 : 6, 0, TAU, 0, Math.PI * 0.55);
  { const p = brainG.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i), d = 1 + (vnoise3(x * 2, y * 2, z * 2) - 0.5) * 0.25; p.setXYZ(i, x * d, y * d * 0.72, z * d); } brainG.computeVertexNormals(); }
  const gb = new GB({ aT: 1 }), rb = rng(7);

    const pts = []; for (let i = 0; i <= 2; i++) { const t = i / 2; pts.push([p[0] + dir[0] * len * t, p[1] + dir[1] * len * t + 0.03 * Math.sin(t * 3), p[2] + dir[2] * len * t]); }

    if (d < T.branchDepth) { const k = 2 + (rb() < 0.4 ? 1 : 0); for (let j = 0; j < k; j++) branch(pts[2], v3.norm(v3.add(dir, [(rb() - 0.5) * 1.3, 0.3 + rb() * 0.3, (rb() - 0.5) * 1.3])), len * 0.78, r * 0.7, d + 1); }
  };
  for (let j = 0; j < 3; j++) branch([0, -0.05, 0], v3.norm([(rb() - 0.5) * 0.8, 1, (rb() - 0.5) * 0.8]), 0.42, 0.055, 0);
  const branchG = gb.build();
  const coralFrag = (extra) => /* glsl */`
vec3 n = normalize(vN); ${extra}
alb = mix(vec3(dot(alb, vec3(0.3, 0.59, 0.11))), alb, 0.78);

  const brainM = mat({
    vh: VH_STD + 'varying vec3 vC;', v: DECOR_V + V_STD.replace('instW(position)', 'instW(position * dF)') + 'vC = instanceColor;',
    fh: VH_STD + 'varying vec3 vC;',
    f: coralFrag('float g = sin(vn3(vO*6.5)*34. + vn3(vO*17.)*3.); vec3 alb = vC * (0.6 + 0.4*smoothstep(-0.5, 0.8, g)) * (0.85 + 0.3*vn3(vO*2.)); float ao = 0.55 + 0.45*clamp(vO.y*1.6 + 0.2, 0., 1.);'),

  const branchM = mat({

    v: DECOR_V + 'float sw = aT*aT*0.06; vec3 p = (position + current(uTime, instO()) * sw * (0.6 + 0.4*sin(uTime*0.9 + instO().x))) * dF;' + V_STD.replace('instW(position)', 'instW(p)') + 'vC = instanceColor; vT = aT;',
    fh: VH_STD + 'varying vec3 vC; varying float vT;',
    f: coralFrag('vec3 alb = mix(vC*0.7, mix(vC, vec3(0.95,0.9,0.85), 0.35), smoothstep(0.5, 1., vT)); float ao = 0.5 + 0.5*vT;'),
  });
  const brain = new THREE.InstancedMesh(brainG, brainM, T.brain), br = new THREE.InstancedMesh(branchG, branchM, T.branch);

  const pts = scatter(T.brain + T.branch, rnd, inReef(rnd), 1.6, (x, z) => reefDist(x, z) < 0.95);
  pts.forEach((p, i) => {
    const y = height(p[0], p[1]); groundNormal(p[0], p[1], nrm);
    const isB = i < T.brain, m = isB ? brain : br, j = isB ? i : i - T.brain, s = isB ? 0.5 + rnd() * 0.9 : 0.7 + rnd() * 0.9;
    setInst(m, j, p[0], y - (isB ? 0.12 * s : 0.05), p[1], rnd() * TAU, s, s, s, nrm, isB ? 0.8 : 0.3);

// sea fans: flat lattice fans facing the current, swaying from the base
{

    u: { uFan: { value: C('seaFan') } },

float l1 = abs(fract(vF.y*15. + w1*0.9) - 0.5), l2 = abs(fract(vF.x*9. + w2*0.9) - 0.5);

vec3 alb = uFan * (0.75 + 0.45*vF.x);

  pts.forEach((p, i) => { const s = 0.7 + rnd() * 0.8; setInst(fans, i, p[0], height(p[0], p[1]) - 0.05, p[1], -CUR.angle + Math.PI / 2 + (rnd() - 0.5) * 0.5, s); });
  fans.count = pts.length; fans.computeBoundingSphere(); scene.add(fans);

// anemone clusters: short column + tentacle ring, tentacles sway with the current
{

// kelp: every stalk is a segmented stipe plus blades; all stalks in one InstancedMesh
let kelp;
{
  const H = CONFIG.kelp.refH, gb = new GB({ aK: 4 }), rb = rng(17), segs = T.kelpSegs;
  const st = []; for (let s = 0; s <= segs; s++) st.push([Math.sin(s * 0.7) * 0.03, s / segs * H, Math.cos(s * 0.5) * 0.03]);
  tube(gb, st, (t) => 0.05 * (1 - 0.45 * t), 3, (t) => ({ aK: [t, -1, 0, 0] }));
  for (let b = 0; b < T.kelpBlades; b++) {
    const t = 0.04 + 0.95 * Math.pow((b + 0.5) / T.kelpBlades, 0.85), y = t * H, ang = b * 2.39996 + rb() * 0.5;
    const canopy = sstep(0.84, 1, t), len = (0.38 + 0.32 * Math.sin(Math.PI * Math.min(t * 1.15, 1)) + canopy * 0.7) * (0.75 + rb() * 0.5);
    const wid = (0.13 + 0.1 * rb()) * (1 + canopy * 0.3), elev = lerp(0.95, 0.15, canopy) + (rb() - 0.5) * 0.6, tw = (rb() - 0.5) * 1.6;
    const dx = Math.cos(ang), dz = Math.sin(ang), base = gb.p.length / 3;
    for (let i = 0; i <= T.bladeSegs; i++) {
      const u = i / T.bladeSegs, al = u * len, ce = Math.cos(elev), se = Math.sin(elev);
      const cx = dx * (0.04 + al * ce), cz = dz * (0.04 + al * ce), cy = y + al * se - 0.18 * len * u * u;
      const w = wid * 0.5 * Math.pow(Math.sin(Math.PI * Math.min(1, 0.1 + u * 0.9)), 0.6) * (1 + 0.15 * Math.sin(u * 19 + b)), tws = Math.sin(tw * u), twc = Math.cos(tw * u);
      const sx = -dz * twc, sy = tws, sz = dx * twc; // side vector twisted around the blade axis
      const bd = [dx * ce, se, dz * ce], nn = v3.norm(v3.cross([sx, sy, sz], bd));
      gb.v(cx - sx * w, cy - sy * w, cz - sz * w, nn[0], nn[1], nn[2], { aK: [t, u, -1, b] });
      gb.v(cx + sx * w, cy + sy * w, cz + sz * w, nn[0], nn[1], nn[2], { aK: [t, u, 1, b] });
    }
    for (let i = 0; i < T.bladeSegs; i++) { const a = base + i * 2; gb.q(a, a + 2, a + 1, a + 3); }
  }
  const geo = gb.build(), rnd = rng(55);
  const pts = scatter(T.kelp, rnd, inDisc(rnd, Z.kelp.x, Z.kelp.z, Z.kelp.r - 2), HIGH ? 2.6 : 3.4);
  const ph = new Float32Array(T.kelp); geo.setAttribute('aPh', new THREE.InstancedBufferAttribute(ph, 1));
  kelp = new THREE.InstancedMesh(geo, mat({
    u: { uStem: { value: C('kelpStem') }, uBlade: { value: C('kelpBlade') }, uTip: { value: C('kelpTip') }, uBend: { value: CONFIG.kelp.bend }, uNear: { value: CONFIG.kelp.nearFade } },
    vh: 'attribute vec4 aK; attribute float aPh; uniform float uBend; varying vec3 vW, vN; varying vec4 vK;',
    v: /* glsl */`
vec4 w = instW(position); vec3 o = instO();
float h = aK.x, bu = max(aK.y, 0.), b2 = h*h, canopy = smoothstep(0.8, 1., h);
vec3 c = current(uTime, o);
vec2 sway = c.xz * uBend * b2 + vec2(sin(uTime*0.55 + aPh + h*2.2), cos(uTime*0.47 + aPh*1.37 + h*1.9)) * ${fl(CONFIG.kelp.wobble)} * b2;
sway += c.xz * bu * (0.5 + 2.2*canopy);
w.xz += sway;
w.y += sin(uTime*2.1 + aPh*3. + aK.w*1.7 + bu*2.5) * 0.1 * bu - dot(sway, sway)*0.035 - canopy*bu*0.35;
vW = w.xyz; vN = instN(normal); vK = aK; gl_Position = projectionMatrix * viewMatrix * w;`,
    fh: 'uniform vec3 uStem, uBlade, uTip; uniform float uNear; varying vec3 vW, vN; varying vec4 vK;',
    f: /* glsl */`
float dist = distance(vW, cameraPosition);
if (dist < uNear && h21(gl_FragCoord.xy) > smoothstep(0.35, uNear, dist)) discard; // never clip through a blade
vec3 n = normalize(vN) * (gl_FrontFacing ? 1. : -1.);
float isB = step(0., vK.y), u = max(vK.y, 0.);
vec3 alb = mix(uStem, uBlade, isB);
alb = mix(alb, uTip, isB * clamp(u*0.55 + vK.x*0.35 - 0.1, 0., 1.));
alb *= 1. - 0.28*isB*(1. - smoothstep(0., 0.35, abs(vK.z))) * (1. - u);   // midrib
alb *= 0.85 + 0.3*vn(vec2(vK.w*3.1, u*6.) + vK.x*40.);
vec3 V = normalize(vW - cameraPosition);
float back = pow(clamp(dot(V, uSunDir), 0., 1.), 3.);
vec3 trans = uTip * isB * (0.25 + 1.3*back) * (0.45 + 0.55*u) * (0.4 + 0.6*vK.x);
vec3 L = mix(lightAt(n), lightAt(-n), 0.4*isB) * (0.55 + 0.45*vK.x) + uSunCol * caust(vW, n) + trans * 0.55;
gl_FragColor = vec4(applyWater(alb * L, vW), 1.);`,
    p: { side: THREE.DoubleSide },
  }), pts.length);
  const bould = [];
  pts.forEach((p, i) => {
    const y = height(p[0], p[1]) - 0.15, s = Math.min(0.875 + rnd() * 0.25, (-1.2 - y) / H);
    _q.setFromEuler(_e.set((rnd() - 0.5) * 0.08, rnd() * TAU, (rnd() - 0.5) * 0.08));
    _m.compose(_v.set(p[0], y, p[1]), _q, _s.set(s, s, s)); kelp.setMatrixAt(i, _m); ph[i] = rnd() * TAU;
    if (i % 2 === 0 && bould.length < T.boulders) { const b = 0.45 + rnd() * 0.7; bould.push([p[0] + (rnd() - 0.5) * 0.6, p[1] + (rnd() - 0.5) * 0.6, b, b * 0.75, rnd() * TAU, 0.9]); }
  });
  kelp.computeBoundingSphere(); kelp.boundingSphere.radius += 6; scene.add(kelp); reducible.push({ mesh: kelp, full: kelp.count });
  rockCluster(bould);
}

// sun rays: crossed additive planes angled with the sun, wrapping around the camera (one draw call)
{
  const rnd = rng(606), P = [], A = [], B = [], idx = [], R = CONFIG.rays;
  for (let i = 0; i < T.rays / 2; i++) {
    const bx = rnd() * R.wrap, bz = rnd() * R.wrap, w = 2.5 + rnd() * 4.5, ph = rnd() * TAU, ang = rnd() * Math.PI;
    for (let k = 0; k < 2; k++) {
      const base = P.length / 3;
      for (const [u, v] of [[0, 0], [1, 0], [0, 1], [1, 1]]) { P.push(0, 0, 0); A.push(u, v, ang + k * Math.PI / 2, w); B.push(bx, bz, ph, i); }
      idx.push(base, base + 2, base + 1, base + 1, base + 2, base + 3);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setAttribute('aR', new THREE.Float32BufferAttribute(A, 4));
  g.setAttribute('aB', new THREE.Float32BufferAttribute(B, 4)); g.setIndex(idx);
  const rays = new THREE.Mesh(g, mat({
    u: { uL: { value: R.wrap }, uLen: { value: R.len }, uA: { value: R.alpha } },
    vh: 'attribute vec4 aR, aB; uniform float uL, uLen; varying vec2 vUv; varying float vF, vId; varying vec3 vW;',
    v: /* glsl */`
vec2 c = cameraPosition.xz + mod(aB.xy - cameraPosition.xz, uL) - uL*0.5;
vec3 ax = -uSunDir, sd = vec3(cos(aR.z), 0., sin(aR.z)); sd = normalize(sd - ax*dot(sd, ax));
vec3 top = vec3(c.x, -0.3, c.y) + sd * sin(uTime*0.09 + aB.z) * 0.8;
float down = aR.y * uLen / uSunDir.y;
vec3 p = top + sd * (aR.x - 0.5) * aR.w * (1. + 0.35*aR.y) + ax * down + sd * sin(uTime*0.13 + aB.z*2.)*0.6*aR.y;
vec3 pn = normalize(cross(sd, ax)), V = normalize(p - cameraPosition);
vF = smoothstep(0.08, 0.45, abs(dot(V, pn))) * (1. - smoothstep(uL*0.32, uL*0.5, length(c - cameraPosition.xz)))
   * smoothstep(1.5, 7., distance(p, cameraPosition));
vUv = aR.xy; vId = aB.w; vW = p; gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.);`,
    fh: 'uniform float uA; varying vec2 vUv; varying float vF, vId; varying vec3 vW;',
    f: /* glsl */`
float e = sin(3.14159*vUv.x); e *= e;
float fall = (1. - smoothstep(0.3, 1., vUv.y)) * (0.45 + 1.1*(1. - vUv.y));
float s = 0.35 + 0.95*vn(vec2(vUv.x*5. + vId*7.3, vUv.y*2.5 - uTime*0.05));
float a = uA * e * fall * s * vF * (1. - fogF(distance(vW, cameraPosition)));
gl_FragColor = vec4(uRay, a);`,
    p: { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide },
  }));
  rays.frustumCulled = false; rays.renderOrder = 5; scene.add(rays);
}

// surface from below: animated ripple brightness plus a Snell's window that follows the camera
const surface = new THREE.Mesh(new THREE.PlaneGeometry(380, 380), mat({
  u: { uSnell: { value: C('snell') } },
  vh: 'varying vec3 vW;',
  v: 'vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w;',
  fh: 'uniform vec3 uSnell; varying vec3 vW;',
  f: /* glsl */`
vec3 v = vW - cameraPosition; float d = length(v); vec3 V = v / d;
float rip = texture2D(uCaust, vW.xz / uCaustTile * 1.6 + uTime*0.012).g;
float r2 = vn(vW.xz*0.5 + uTime*vec2(0.21, 0.13)) + vn(vW.xz*1.3 - uTime*vec2(0.12, 0.2))*0.5;
float win = smoothstep(0.62, 0.7, V.y + (r2 - 0.75)*0.05);                 // critical angle ~48.6 deg

vec3 col = mix(tir, uSnell * (0.95 + 0.25*r2) + uSnell*rip*0.35, win);
col += uSnell * rip * 0.12 * (1. - win) + vec3(1.) * pow(max(dot(V, uSunDir), 0.), 220.) * 1.5;
gl_FragColor = vec4(mix(col, waterFog(V), fogF(d)), 1.);`,
  p: { side: THREE.DoubleSide, depthWrite: false },
}));
